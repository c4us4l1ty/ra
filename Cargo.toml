[package]
name = "ra"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A modular, near-zero-cost panel for XFCE/Wayland written in Rust and GTK4"
license = "MIT"
readme = "README.md"
repository = "https://github.com/c4us4l1ty/ra"
keywords = ["panel", "xfce", "wayland", "gtk4", "wlr-layer-shell"]
categories = ["gui"]

# Deliberately minimal. `gtk4` pulls in glib, gio, gdk, pango and cairo
# transitively, so a complete D-Bus client, main loop, settings system and CSS
# engine come for free. No async runtime, no D-Bus crate, no HTTP client, no
# database, no icon catalogue.
[dependencies]
gtk4 = { version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
serde = { version = "1", features = ["derive"] }
# `display` pulls in toml_writer, which is what lets the settings window write
# the config back. Without it ra can read a config but never change one.
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "display", "std"] }
# Already compiled in as part of gtk4's own tree; listed directly only so the
# renderer can turn a widget tree into a PNG for `ra --screenshot`.
gsk4 = "0.11"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# A panel that panics is a panel the user cannot get back without a logout, and
# there is no unwinding to do at runtime anyway.
panic = "abort"
strip = true
